services:
  - type: web
    name: quiz-bot-manager
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: MAIN_BOT_TOKEN
        sync: false          # set this in Render dashboard → Environment
      - key: ADMIN_ID
        sync: false          # set this in Render dashboard → Environment
      - key: DB_PATH
        value: /data/quiz_bot.db
      - key: PORT
        value: "8080"
    disk:
      name: bot-data
      mountPath: /data
      sizeGB: 1
