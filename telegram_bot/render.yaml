services:
  - type: web
    name: quiz-bot-manager
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: MAIN_BOT_TOKEN
        sync: false          # set in Render dashboard → Environment
      - key: ADMIN_ID
        sync: false          # set in Render dashboard → Environment
      - key: NEON_DATABASE_URL
        sync: false          # set in Render dashboard → Environment (your Neon connection string)
      - key: PORT
        value: "10000"
