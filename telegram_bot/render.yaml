services:
  - type: web
    name: quiz-bot-manager
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: MAIN_BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: NEON_DATABASE_URL
        sync: false
      - key: LOG_GROUP_ID
        sync: false
      - key: PORT
        value: "10000"
